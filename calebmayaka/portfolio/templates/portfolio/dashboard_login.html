{% extends 'portfolio/base.html' %}

{% block content %}
<section class="dashboard-login-screen">
    <div class="dashboard-login-panel reveal">
        <a class="dashboard-login-brand" href="{% url 'home' %}">calebmayaka.com</a>

        <div class="dashboard-login-head">
            <p>Admin access</p>
            <h1>Sign in</h1>
        </div>

        <form class="dashboard-login-form" method="post" novalidate>
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">

            {% if form.non_field_errors %}
                <div class="dashboard-login-error">{{ form.non_field_errors }}</div>
            {% endif %}

            <label>
                <span>Email</span>
                {{ form.username }}
                {{ form.username.errors }}
            </label>
            <label>
                <span>Password</span>
                {{ form.password }}
                {{ form.password.errors }}
            </label>
            <button type="submit">Sign in</button>
        </form>
    </div>
</section>
{% endblock %}
